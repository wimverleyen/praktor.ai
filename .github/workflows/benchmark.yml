name: Benchmark

on:
  push:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama daemon
        run: |
          ollama serve &
          # Wait until the server is accepting connections (up to 30s)
          for i in $(seq 1 30); do
            ollama list 2>/dev/null && break
            sleep 1
          done

      - name: Pull model
        run: ollama pull qwen2.5

      - name: Run benchmark
        working-directory: praktor
        run: python ../benchmarks/run_benchmark.py --trials 3 --warmup 1

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results.md
