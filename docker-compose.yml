# docker compose up — starts RabbitMQ + praktor consumer
# docker compose run praktor publish --agent thank_you --data '{"adjective":"warm","position":"CTO","content":"Great chat"}'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  praktor:
    build:
      context: .
      args:
        EXTRAS: ""  # Add "kafka,minio" for enterprise sinks
    depends_on:
      rabbitmq:
        condition: service_healthy
    network_mode: host  # Access host Ollama on localhost:11434
    environment:
      PRAKTOR_MODEL: "qwen2.5"
      RABBITMQ_URL: "amqp://guest:guest@localhost:5672/"
      PRAKTOR_CONCURRENCY: "4"
      CACHE_DIR: "/tmp/praktor_cache"
    volumes:
      - praktor-audit:/app/audit  # Persist audit logs

volumes:
  praktor-audit:
