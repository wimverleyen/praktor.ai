[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praktor"
version = "0.4.0"
description = "Local-first agentic framework with built-in governance for regulated industries"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "faiss-cpu>=1.8.0",
    "pika>=1.3.2",
    "aio-pika>=9.0.0",
    "python-dotenv>=1.0.0",
    "pypdf>=4.0.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
    "diskcache>=5.0.0",
    "duckduckgo-search>=6.0.0",
    "filelock>=3.12.0",
    "duckdb>=0.10",
    "python-ulid>=2.0.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
presidio = [
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.7.0",
]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
kafka = [
    "aiokafka>=0.10.0",
]
minio = [
    "minio>=7.2.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[tool.hatch.build.targets.wheel]
include = [
    "praktor/**/*.py",
    "praktor/py.typed",
]
